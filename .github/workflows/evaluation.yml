name: Evaluation contracts
on:
  push:
    paths: ['eval/**', '.github/workflows/evaluation.yml']
  pull_request:
    paths: ['eval/**', '.github/workflows/evaluation.yml']
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[api]'
      - run: python tools/validate.py
      - run: python -m zwz_eval check-source
      - run: python -m zwz_eval plan --config examples/all.json --bench memlens
